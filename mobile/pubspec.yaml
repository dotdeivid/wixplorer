name: wixplorer_mobile
description: "WiXplorer — accede a los archivos de tu teléfono desde el navegador."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  mime: ^2.1.0
  uuid: ^4.6.0
  network_info_plus: ^8.2.2
  wakelock_plus: ^1.8.2
  device_info_plus: ^13.3.0
  fc_native_video_thumbnail: ^4.0.0
  image: ^4.12.0
  flutter_image_compress: ^2.5.1
  path: ^1.9.1
  url_launcher: ^6.3.3
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Imagen fuente 1024×1024 px (fondo azul + ícono swap blanco)
  # Ejecutar: flutter pub run flutter_launcher_icons
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#2F7FF5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/www/
    - assets/www/assets/
