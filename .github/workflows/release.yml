name: Build & Release

# Dispara en push de tag vX.Y.Z  (ej: git tag v1.0.1 && git push --tags)
# También se puede lanzar manualmente desde la pestaña Actions de GitHub.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. Lint + tests + compilar React — resultado compartido con los jobs siguientes
  # ────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # 2. APK Android  (firma con debug key; ver nota al pie para release signing)
  # ────────────────────────────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    env:
      # `secrets` no se puede usar en el `if` de un paso; se expone vía env.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Descargar web compilada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: mobile/assets/www/

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Versión fija: con '3.x' cada release nueva de Flutter puede
          # romper CI (deprecaciones en analyze, mínimos de AGP/Gradle).
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      # Si el repo tiene secrets de keystore, firmar con clave de producción.
      # Si no, Flutter usa la debug key (válida para distribución directa/APK sideload).
      - name: Configurar keystore (opcional)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: flutter analyze + test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: flutter build apk --release
        working-directory: mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Crear GitHub Release con el APK
  #    (la web se publica aparte, en GitHub Pages: pages.yml)
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release/

      - name: Renombrar APK
        run: mv release/app-release.apk release/WiXplorer.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: WiXplorer ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/WiXplorer.apk
