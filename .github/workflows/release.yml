name: Build & Release

# Dispara en push de tag vX.Y.Z  (ej: git tag v1.0.1 && git push --tags)
# También se puede lanzar manualmente desde la pestaña Actions de GitHub.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. Lint + tests + compilar React — resultado compartido con los jobs siguientes
  # ────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # 2. APK Android  (firma con debug key; ver nota al pie para release signing)
  # ────────────────────────────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    env:
      # `secrets` no se puede usar en el `if` de un paso; se expone vía env.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Descargar web compilada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: mobile/assets/www/

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Versión fija: con '3.x' cada release nueva de Flutter puede
          # romper CI (deprecaciones en analyze, mínimos de AGP/Gradle).
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      # Si el repo tiene secrets de keystore, firmar con clave de producción.
      # Si no, Flutter usa la debug key (válida para distribución directa/APK sideload).
      - name: Configurar keystore (opcional)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: flutter analyze + test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: flutter build apk --release
        working-directory: mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Binarios de escritorio — macOS Universal (.app) + Windows (.exe)
  #    Corre en macOS para poder usar lipo y codesign.
  # ────────────────────────────────────────────────────────────────────────────
  build-desktop:
    name: Build Desktop (macOS + Windows)
    runs-on: macos-latest
    needs: build-web
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Descargar web compilada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: launcher/dist/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.mod

      - name: go vet + test
        run: |
          go vet .
          go test .

      - name: Instalar goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

      # El sufijo _windows_amd64 hace que Go enlace el .syso solo para ese
      # target; el build de macOS lo ignora sin tener que borrarlo.
      # -64: objeto COFF de amd64 (sin el flag sale de 386 y el link falla).
      - name: Generar resource_windows_amd64.syso (metadatos + ícono Windows)
        run: |
          ~/go/bin/goversioninfo -64 \
            -icon="packaging/icon.ico" \
            -o="resource_windows_amd64.syso" \
            "packaging/versioninfo.json"

      # Se compila el paquete (.) y no main.go: con una lista de archivos,
      # Go ignora los .syso del directorio y el .exe sale sin ícono.
      - name: Build Windows .exe
        run: |
          mkdir -p ../dist_bin
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -H windowsgui" \
            -o ../dist_bin/WiXplorer.exe .

      - name: Build macOS Universal (arm64 + amd64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist_bin/WiXplorer_arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist_bin/WiXplorer_amd64 .
          lipo -create -output ../dist_bin/WiXplorer_mac \
            ../dist_bin/WiXplorer_arm64 \
            ../dist_bin/WiXplorer_amd64
          rm ../dist_bin/WiXplorer_arm64 ../dist_bin/WiXplorer_amd64

      - name: Armar WiXplorer.app
        run: |
          APP="../dist_bin/WiXplorer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ../dist_bin/WiXplorer_mac "$APP/Contents/MacOS/WiXplorer"
          chmod +x "$APP/Contents/MacOS/WiXplorer"
          cp packaging/Info.plist  "$APP/Contents/Info.plist"
          cp packaging/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          # Firma ad-hoc (evita advertencias de Gatekeeper en Mac sin notarización)
          codesign --deep --force --sign - "$APP" 2>/dev/null || true

      - name: Empaquetar macOS (.zip preserva permisos de ejecución)
        run: |
          cd ../dist_bin
          zip -r --symlinks WiXplorer_mac.zip WiXplorer.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-zip
          path: dist_bin/WiXplorer_mac.zip
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist_bin/WiXplorer.exe
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Crear GitHub Release con los tres artefactos
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-desktop]
    permissions:
      contents: write
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release/

      - name: Descargar macOS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-zip
          path: release/

      - name: Descargar Windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: release/

      - name: Renombrar APK
        run: mv release/app-release.apk release/WiXplorer.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: WiXplorer ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/WiXplorer.apk
            release/WiXplorer_mac.zip
            release/WiXplorer.exe
