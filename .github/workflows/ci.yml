name: CI

# Lint + tests en cada push a main y en cada PR.
# El workflow de release (release.yml) corre los mismos checks antes de publicar.
on:
  push:
    branches: [main]
  pull_request:

jobs:

  # React: lint, tests (vitest) y build — el build lo necesitan Go (embed) y Flutter (assets)
  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # Launcher Go: go:embed necesita dist/ presente para compilar
  go:
    name: Go — vet, test
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet .
      - run: go test .

  # Flutter: pubspec declara assets/www/, que sale del build web
  mobile:
    name: Flutter — analyze, test
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: mobile/assets/www/

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Versión fija: con '3.x' cada release nueva de Flutter puede
          # romper CI (deprecaciones en analyze, mínimos de AGP/Gradle).
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: flutter test
        working-directory: mobile
        run: flutter test
